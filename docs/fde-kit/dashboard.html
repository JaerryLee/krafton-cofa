<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실무 데이터 검토</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #f5f5fa; color: #211d31; }
    * { box-sizing: border-box; }
    main { width: min(100% - 2rem, 850px); margin: 2rem auto; }
    h1 { letter-spacing: -.045em; }
    label { display: block; margin-bottom: .4rem; font-weight: 650; }
    input { width: 100%; padding: .75rem; font: inherit; border: 1px solid #bdb4d3; border-radius: .55rem; }
    ul { list-style: none; padding: 0; display: grid; gap: .75rem; }
    li { padding: .8rem 1rem; background: white; border: 1px solid #e0dcea; border-radius: .6rem; overflow-wrap: anywhere; }
    code { color: #5734cc; }
    li p { margin: .45rem 0 0; }
    [role=status] { color: #625a73; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">실무 데이터 검토</h1>
    <label for="search">기록 검색</label>
    <input type="search" id="search" placeholder="ID 또는 내용으로 찾기">
    <p id="status" role="status">샘플 데이터를 불러오는 중입니다.</p>
    <ul id="records" aria-label="기록"></ul>
  </main>
  <script>
    const title = document.getElementById("title");
    const search = document.getElementById("search");
    const status = document.getElementById("status");
    const list = document.getElementById("records");
    let records = [];

    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = records.filter(({ id, label, detail }) =>
        [id, label, detail].some((value) => value.toLowerCase().includes(query)));
      list.replaceChildren(...visible.map(({ id, label, detail }) => {
        const row = document.createElement("li");
        const heading = document.createElement("strong");
        const identifier = document.createElement("code");
        const description = document.createElement("p");
        identifier.textContent = id;
        heading.append(identifier, " · ", label);
        description.textContent = detail;
        row.append(heading, description);
        return row;
      }));
      status.textContent = visible.length ? visible.length + "건 표시" : "표시할 기록이 없습니다.";
    }

    async function load() {
      try {
        const response = await fetch("/api/records");
        if (!response.ok) throw new Error("Could not load records");
        const data = await response.json();
        title.textContent = data.title;
        records = data.records;
        search.addEventListener("input", render);
        render();
      } catch {
        status.textContent = "데이터를 불러올 수 없습니다. 서버 로그를 확인한 뒤 새로고침하세요.";
      }
    }

    load();
  </script>
</body>
</html>
